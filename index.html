<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2f6fed" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="オフラインで動作する間隔反復（SM-2）の暗記アプリ" />
    <title>暗記アプリ</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="暗記" />
    <link rel="stylesheet" href="./css/style.css" />
    <script>
      // 初回描画前に配色と表示モードを適用する（src/theme.js / src/mode.js と同じキーを読む）
      try {
        var t = localStorage.getItem('memoapp:theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var m = localStorage.getItem('memoapp:mode');
        if (m === 'kid') document.documentElement.dataset.mode = m;
      } catch (e) {}
    </script>
  </head>
  <body>
    <main id="app"><div class="screen"><p class="hint">読み込み中…</p></div></main>
    <noscript>このアプリの利用にはJavaScriptが必要です。</noscript>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
