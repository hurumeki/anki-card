name: CI

on:
  push:
    branches: [main]
  pull_request:

# 依存パッケージを持たないため、インストール手順はありません。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 書式チェック
        run: npm run format:check
      - name: テスト
        run: npm test
